site_name: busylib
site_description: Python library for BUSY Bar API
site_url: https://busylib.readthedocs.io/
repo_url: https://github.com/busy-app/busylib-py
repo_name: busy-app/busylib-py
edit_uri: edit/main/docs/

theme:
  name: material
  # Brand kit, section 02 - Typography: Inter is the system font, listed for
  # "apps and web interfaces, documentation, long-form content"; Geist Mono
  # is the technical monospace face. Pragmatica Next is reserved for brand
  # and hero surfaces, so it isn't used here.
  font:
    text: Inter
    code: Geist Mono
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# BUSY Bar palette (black/white/red/grey) rather than Material's default.
extra_css:
  - stylesheets/busybar.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            filters:
              - "!^_"
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - Connecting to a bar: guides/connecting.md
      - Drawing on the displays: guides/displays.md
      - Assets and storage: guides/assets-and-storage.md
      - Reading device state: guides/device-state.md
  - Reference:
      - Clients: api/clients.md
      - Device discovery: api/discovery.md
      - Displays and frames: api/display.md
      - Features: api/features.md
      - Converters: api/converter.md
      - Types: api/types.md
      - Exceptions: api/exceptions.md
