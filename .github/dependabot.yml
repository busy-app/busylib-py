version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # .pre-commit-config.yaml. This used to say "pip" with the same directory as
  # the block above, which opened every Python update twice and left the hook
  # revisions untouched. Only pre-commit-hooks is pinned there now - ruff,
  # pyproject-fmt and pyright run as local hooks off the pins in
  # pyproject.toml - so a bump from either ecosystem stands on its own. They
  # were pinned in both files before, and nothing could move both at once.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
