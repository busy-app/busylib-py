[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77", "setuptools-scm" ]

[project]
name = "busylib"
description = "Python library for Busy Bar API"
readme = "README.md"
license = "MIT"
authors = [
  { name = "flipperdevices", email = "pypi@flipperdevices.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "httpx>=0.28.1",
  "protobuf>=6.31.1",
  "pydantic>=2.9",
  "pydantic-extra-types>=2.9",
  "pydantic-settings>=2.12",
  "typing-extensions>=4.6",
  "websockets>=12",
  "zeroconf>=0.150",
]
optional-dependencies.docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.28",
]
# Image conversion is the only thing that needs Pillow, and it is by far the
# heaviest dependency available to this package, so it is opt-in.
optional-dependencies.media = [
  "pillow>=12",
]
urls.Documentation = "https://busy-app.github.io/busylib-py/"
urls.Homepage = "https://github.com/busy-app/busylib-py"
urls.Repository = "https://github.com/busy-app/busylib-py"

[dependency-groups]
# Linters are pinned to the versions .pre-commit-config.yaml uses. With
# ranges, CI installed whatever was newest and a linter release could turn
# unrelated pull requests red: ruff 0.16 widened its default rule set, which
# fails the whole repository including main.
dev = [
  "grpcio-tools>=1.74",
  "pillow>=12",
  "pre-commit>=3.8",
  "pyproject-fmt==2.27.1",
  "pyright==1.1.411",
  "pytest>=8.4.1",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7",
  "ruff==0.16.3",
  "tomli>=2.2",
]

[tool.setuptools]
packages.find.where = [ "src" ]
package-dir = { "" = "src" }

[tool.setuptools_scm]
write_to = "src/busylib/_version.py"
write_to_template = "__version__ = '{version}'\n"

[tool.ruff]
extend-exclude = [
  ".pytest_cache",
  ".vscode",
  "__pycache__",
  "build",
  # protoc output: regenerated by `make proto-sync`, so linting or
  # reformatting it only creates churn that the next sync undoes.
  "src/busylib/state_stream_proto",
]
# Selected explicitly rather than extending ruff's defaults. Those defaults
# widen between releases - 0.16 added enough rules to fail this repository,
# including main - which turned every ruff bump into unrelated work and is
# why the version is pinned. Listing them means a bump changes only the
# implementation of these rules, and adopting new ones stays a decision.
lint.select = [
  # pycodestyle errors: the subset ruff enables by default.
  "E4",
  "E7",
  "E9",
  # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
  # https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "UP",
]

[tool.pytest]
ini_options.pythonpath = [ "." ]
# Integration tests need a real bar, so they are opt-in: -m integration
# selects them, and -m "integration and manual" the ones needing a human.
ini_options.addopts = "-q -m 'not integration'"
ini_options.markers = [
  "integration: exercises a real device over USB, LAN or the cloud",
  "manual: needs someone to press buttons on the bar",
]
ini_options.asyncio_mode = "auto"
